apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp159-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp159-api
  template:
    metadata:
      labels:
        app: mp159-api
    spec:
      containers:
        - name: mp159-api
          image: mp159-api:1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
