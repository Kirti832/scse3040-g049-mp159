name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pytest==8.3.3 fastapi==0.115.5 httpx==0.27.2 pydantic==2.10.2 pandas==2.2.3 numpy==1.26.4 scikit-learn==1.5.2 PyYAML==6.0.2 joblib==1.4.2
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: pytest -v
